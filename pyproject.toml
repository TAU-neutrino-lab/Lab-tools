[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-tools"
version = "0.1.5"
description = "Shared tools for TAU neutrino lab analysis, IO, and simulation workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Emilie Bertholet" }
]
dependencies = [
  "h5py>=3.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "scipy>=1.10",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel",
  "jupyterlab",
  "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
